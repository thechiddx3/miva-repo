<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Wisdom Ezimah</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Wisdom.Dev</a>
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
            </button>
            <nav id="primaryNav">
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Me</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="planner.html">Academic Planner</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2 style="color: var(--primary-color); margin-bottom: 0.5rem; text-align: center;">Get In Touch</h2>
            <p style="text-align: center; margin-bottom: 1.5rem; font-size: 0.95rem;">Send an inquiry, collaboration
                request, or academic feedback.</p>

            <div id="successMessage" class="alert-success">Thank you! Your message has been sent
                successfully.</div>

            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Your name">
                    <small id="nameError" class="error-text"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="e.g. name@example.com">
                    <small id="emailError" class="error-text"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. 08012345678">
                    <small id="phoneError" class="error-text"></small>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="4" placeholder="Write your message here..."></textarea>
                    <small id="messageError" class="error-text"></small>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Submit Inquiry</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Wisdom Chidozie Ezimah. All Rights Reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>
</body>

</html>
